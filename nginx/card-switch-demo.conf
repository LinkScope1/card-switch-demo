server {
    listen 80;
    listen [::]:80;
    # Replace with the real domain after DNS is ready. For temporary public-IP
    # testing, use the default_server/server_name _ block from DEPLOYMENT.md.
    server_name links.example.com;

    root /var/www/card-switch-demo;
    index index.html;

    # /manage -> /manage/
    location = /manage {
        return 301 /manage/;
    }

    # Static card-switch-demo frontend.
    location ^~ /manage/ {
        alias /var/www/card-switch-demo/;
        index index.html;
    }

    # Strip /linkapi/ before forwarding to Core.
    # /linkapi/api/links -> /api/links
    # /linkapi/Abc12345 -> /Abc12345
    # 3200 is the example host port. Keep the container port at 3000 and
    # replace this host port if LINKFORTY_PORT is different.
    location ^~ /linkapi/ {
        proxy_pass http://127.0.0.1:3200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
