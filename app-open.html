<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; background: #fff; }
    .spinner { width: 42px; height: 42px; border: 4px solid #dce8f6; border-top-color: #1473ed; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner" role="status" aria-live="polite" aria-label="正在打开中国工商银行 App"></div>
  <script src="./config.js"></script>
  <script src="./app-open.js"></script>
</body>
</html>
